# Tooling for this repo's own code (mocks/, scripts/). Upstream projects under
# upstream/ keep their own configuration.
[tool.pytest.ini_options]
testpaths = ["mocks/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["upstream", ".dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
